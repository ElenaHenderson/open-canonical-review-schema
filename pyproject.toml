[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canonreview"
version = "0.1.0"
description = "Canonical peer-review schema + mappers for OpenReview, CMT, and narrative journal reviews."
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.19.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
