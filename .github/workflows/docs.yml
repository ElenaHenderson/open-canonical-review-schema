name: Generate Schema Documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/ocrs/schemas/**'
      - 'src/ocrs/registry.py'  # the homepage diagram's arrows follow its exporters
      - 'versions/**'
      - 'crosswalk/**'  # published beside the current schema
      - 'site/**'
      - 'scripts/generate_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:  # Allow manual triggering

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Generate documentation
        run: uv run python scripts/generate_docs.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  # Publishes only from main in the public repo, so other branches never deploy.
  deploy:
    if: github.repository == 'valency-oss/open-canonical-review-schema' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
