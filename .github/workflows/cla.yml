name: CLA

# Asks each pull request author to sign CLA.md by commenting on the pull request, and records
# the signature in signatures/cla.json on the cla-signatures branch (the default branch's
# rulesets would block the bot's commits there).
on:
  issue_comment:
    types: [created]
  # pull_request_target runs this file from the default branch with a write token; it never
  # checks out or runs the pull request's code, so a fork can't change what runs here
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write  # commit signatures to the cla-signatures branch
  pull-requests: write  # comment, and lock the pull request once merged
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # The action locks every pull request it sees closed, so a closed one runs it only when
    # merged: one closed unmerged stays open to comments
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.action != 'closed' || github.event.pull_request.merged)) ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # contributor-assistant/github-action is archived (read-only since 2026-03), so this pin
      # (v2.6.1) can't move; replace it with a maintained fork if it stops working
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/valency-oss/open-canonical-review-schema/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # Bots, and Valency staff, whose work Valency already owns: the core-maintainers
          # team plus ElenaHenderson and francisco-the-man
          allowlist: dependabot[bot],github-actions[bot],copilot-swe-agent[bot],karthik,profjsb,curtisjm,ElenaHenderson,francisco-the-man
          lock-pullrequest-aftermerge: true
